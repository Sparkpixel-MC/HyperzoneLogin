name: Weekly Release

on:
  schedule:
    - cron: '0 18 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  Sync-Upstream:
    name: Sync Upstream
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge Upstream Changes
        env:
          UPSTREAM_REPO: 'https://github.com/HyperZoneLogin/HyperzoneLogin.git'
          UPSTREAM_BRANCH: 'master'
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream "$UPSTREAM_REPO"
          else
            git remote add upstream "$UPSTREAM_REPO"
          fi
          git fetch upstream "$UPSTREAM_BRANCH"

          if git merge "upstream/$UPSTREAM_BRANCH" --no-edit -X ours; then
            echo "Merge succeeded."
          else
            echo "Merge had conflicts, resolving by keeping ours..."
            for file in $(git diff --name-only --diff-filter=U); do
              echo "Keeping ours for conflicted file: $file"
              git checkout --ours -- "$file" || true
              git add -- "$file" || true
            done
            git commit --no-edit || true
          fi

      - name: Sync and Update Submodules
        run: |
          set -e
          git submodule sync --recursive || true
          git submodule update --init --recursive --force
          git submodule status --recursive || true

      - name: Push Merged Result Back to Downstream
        run: |
          set -e
          git push origin HEAD:${{ github.ref_name }} || echo "Push failed, continuing anyway"

  Build:
    name: Build Plugin JAR
    needs: Sync-Upstream
    runs-on: ubuntu-latest
    outputs:
      Jar_Name: ${{ steps.Find_Jar.outputs.Jar_Name }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Build Plugin JARs
        run: ./gradlew clean build buildCtdDistributions -PreleaseChannel=WEEKLY

      - name: Locate Velocity JAR
        id: Find_Jar
        run: |
          set -e
          JAR=$(find velocity/build/libs -maxdepth 1 -type f -name '*.jar' \
                  ! -name '*-all.jar' \
                  ! -name '*-sources.jar' \
                  ! -name '*-javadoc.jar' \
                  | sort | head -n 1)
          if [ -z "$JAR" ]; then
            echo "No suitable JAR found in velocity/build/libs" >&2
            ls -la velocity/build/libs || true
            exit 1
          fi
          echo "Jar_Path=$JAR" >> "$GITHUB_OUTPUT"
          echo "Jar_Name=$(basename "$JAR")" >> "$GITHUB_OUTPUT"
          echo "Selected JAR: $JAR"

      - name: Upload Velocity JAR
        uses: actions/upload-artifact@v4
        with:
          name: Velocity-JAR
          path: ${{ steps.Find_Jar.outputs.Jar_Path }}
          if-no-files-found: error

  Release:
    name: Publish Release
    needs: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Velocity JAR
        uses: actions/download-artifact@v4
        with:
          name: Velocity-JAR
          path: Release-Assets/Velocity-JAR

      - name: List Release Assets
        run: |
          find Release-Assets -type f | sort

      - name: Compute Weekly Tag
        id: Meta
        run: |
          TAG="weekly-$(date -u +%G).W$(date -u +%V)"
          echo "Tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Name=HyperZoneLogin $TAG" >> "$GITHUB_OUTPUT"

      - name: Update Weekly Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "${{ steps.Meta.outputs.Tag }}"
          git push origin "refs/tags/${{ steps.Meta.outputs.Tag }}" --force

      - name: Publish Weekly Prerelease
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.Meta.outputs.Tag }}
          name: ${{ steps.Meta.outputs.Name }}
          prerelease: true
          allowUpdates: true
          artifactErrorsFailBuild: true
          removeArtifacts: true
          artifacts: |
            Release-Assets/Velocity-JAR/*.jar
          body: |
            ## 🚀 HyperZoneLogin Weekly Release

            Welcome to this week's automated build! 🎉

            ### 📦 Included Artifacts
            - **Velocity Plugin JAR**: `${{ needs.Build.outputs.Jar_Name }}`

            ### 🔄 Upstream Merge
            This release includes the latest changes from upstream.
            Any merge conflicts were resolved by keeping the downstream implementation.

            ### 🧩 Submodules
            Submodules have been synced and updated to the commits recorded by the merged main repository.

            ### 🛠️ Installation
            1. Download the Velocity plugin JAR from the assets below.
            2. Place it into your Velocity `plugins/` folder.
            3. Restart your proxy.

            ### 📝 Changelog
            The full changelog is auto-generated below. 👇

            ---
            _If you encounter any issues, please open an Issue and include your environment, modules, logs, config snippets, and reproduction steps._
          generateReleaseNotes: true